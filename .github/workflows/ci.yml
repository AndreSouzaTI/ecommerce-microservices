name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes de todos os módulos
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [discovery-server, api-gateway, catalog-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem ${{ matrix.service }}
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }} .
